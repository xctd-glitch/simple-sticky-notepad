<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Sticky Notepad</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="tailwind-preflight.css">
  <style>
    body {
      width: 384px;
      height: 448px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .toast {
      animation: toast-in 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body class="flex flex-col">

  <main class="flex-auto p-4 flex flex-col gap-3">
    <div class="flex-auto flex flex-col">
      <label for="noteText" class="sr-only">Note Content</label>
      <textarea id="noteText" placeholder="Write a quick note..." class="w-full h-full p-2.5 block resize-none border rounded-md outline-none font-mono text-sm leading-snug" aria-describedby="charCount"></textarea>
    </div>
    <div class="flex-none flex items-center justify-between text-xs">
      <div class="flex items-center gap-2" aria-live="polite">
        <span id="statusDot" class="w-2 h-2 rounded-full" aria-hidden="true"></span>
        <span id="saveState"></span>
      </div>
      <span id="charCount" aria-live="polite"></span>
    </div>
  </main>

  <footer class="flex-none p-3 border-t">
    <div class="grid grid-cols-4 gap-2 text-xs">
      <button id="saveNote" class="p-2 border rounded-md">Save</button>
      <button id="saveFile" class="p-2 border rounded-md">Save File</button>
      <button id="loadFile" class="p-2 border rounded-md">Load File</button>
      <button id="setDirectory" class="p-2 border rounded-md">Set Dir</button>
      <button id="openSticky" class="p-2 border rounded-md">Show Sticky</button>
      <button id="clearNote" class="p-2 border rounded-md">Clear</button>
      <button id="openOptions" class="p-2 border rounded-md">Options</button>
    </div>
    <div id="dirLabel" class="mt-2.5 text-center text-xs truncate"></div>
  </footer>

  <input type="file" id="filePicker" class="hidden" title="Select a file to load" aria-label="Select a file to load">
  <div id="toastHost" class="fixed bottom-4 right-4 flex flex-col gap-2" role="status" aria-live="assertive" aria-atomic="true"></div>

  <script src="popup.js"></script>
</body>
</html>
